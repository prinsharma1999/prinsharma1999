name: Generate Snake Animation

on:
  schedule: # 18:00 UTC daily, same as the 3D graph
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    name: generate-contribution-snake
    steps:
      - name: Generate snake from contribution grid
        uses: Platane/snk@v3.5.0
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=#00ff9c&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
