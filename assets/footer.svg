<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-label="Thanks for scrolling — graphs regenerate daily via GitHub Actions">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09130F"/>
      <stop offset="45%" stop-color="#0C1714"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <radialGradient id="fglow" cx="86%" cy="10%" r="80%">
      <stop offset="0%" stop-color="#00FF9C" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#00FF9C" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="frule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00FF9C" stop-opacity="0"/>
      <stop offset="48%"  stop-color="#0F9B6C" stop-opacity="0.45"/>
      <stop offset="90%"  stop-color="#00FF9C" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#00FF9C" stop-opacity="0"/>
    </linearGradient>

    <pattern id="fgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00FF9C" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <clipPath id="fround">
      <rect x="1" y="1" width="1198" height="128" rx="14"/>
    </clipPath>

    <style>
      .fmono {
        font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco,
                     Consolas, "Liberation Mono", "Courier New", monospace;
      }
      .fline  { font-size: 17px; fill: #7D8590; }
      .faccent{ fill: #00FF9C; }
      .fmeta  { font-size: 12.5px; fill: #56606A; letter-spacing: 1.7px; }

      .fcursor { animation: fblink 1.1s steps(1, end) infinite; }
      @keyframes fblink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }

      /* transform-only + backwards: stays visible without an animation clock */
      .frise { animation: frise .9s cubic-bezier(.22,.9,.25,1) backwards; }
      @keyframes frise {
        from { transform: translateY(10px) }
        to   { transform: translateY(0) }
      }
      .fd1 { animation-delay: .10s } .fd2 { animation-delay: .30s }
    </style>
  </defs>

  <g clip-path="url(#fround)">
    <rect width="1200" height="130" fill="url(#fbg)"/>
    <rect width="1200" height="130" fill="url(#fgrid)"/>
    <rect width="1200" height="130" fill="url(#fglow)"/>

    <rect x="0" y="0" width="1200" height="1.6" fill="url(#frule)"/>

    <g class="frise fd1">
      <text class="fmono fline" x="44" y="58">
        <tspan class="faccent">$</tspan><tspan dx="10">thanks for scrolling — now go find some bugs</tspan><tspan class="faccent fcursor" dx="8">█</tspan>
      </text>
    </g>

    <g class="frise fd2">
      <text class="fmono fmeta" x="44" y="96">3D GRAPH · SNAKE · STREAK — REGENERATED DAILY BY GITHUB ACTIONS</text>
      <text class="fmono fmeta" x="1176" y="96" text-anchor="end">PRIN@CIPHER.ACADEMY</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="129" rx="14" fill="none" stroke="#243239" stroke-width="1"/>
  </g>
</svg>
