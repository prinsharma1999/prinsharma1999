<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Prin Sharma — Bug Bounty Hunter, Reverse Engineer, Full-Stack Builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="60%" stop-color="#0C1714"/>
      <stop offset="100%" stop-color="#09130F"/>
    </linearGradient>

    <radialGradient id="glow" cx="14%" cy="88%" r="78%">
      <stop offset="0%" stop-color="#00FF9C" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#00FF9C" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00FF9C" stop-opacity="0"/>
      <stop offset="10%"  stop-color="#00FF9C" stop-opacity="0.95"/>
      <stop offset="52%"  stop-color="#0F9B6C" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00FF9C" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00FF9C" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <clipPath id="round">
      <rect x="1" y="1" width="1198" height="258" rx="14"/>
    </clipPath>

    <style>
      .mono {
        font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco,
                     Consolas, "Liberation Mono", "Courier New", monospace;
      }
      .name   { font-size: 56px; font-weight: 700; letter-spacing: 3px; fill: #E6EDF3; }
      .accent { fill: #00FF9C; }
      .dim    { fill: #7D8590; }
      .role   { font-size: 18px; font-weight: 500; letter-spacing: 0.6px; fill: #00FF9C; }
      .chrome { font-size: 13px; fill: #6E7681; letter-spacing: 0.4px; }
      .meta   { font-size: 12.5px; fill: #56606A; letter-spacing: 1.7px; }

      .cursor { animation: blink 1.1s steps(1, end) infinite; }
      @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }

      /* Entrance animates transform only, and uses `backwards` (never `both`),
         so the element's natural state is fully visible. If the animation clock
         never advances -- static snapshot, reduced motion, non-animating
         renderer -- the text still shows instead of vanishing at opacity 0. */
      .rise { animation: rise .9s cubic-bezier(.22,.9,.25,1) backwards; }
      @keyframes rise {
        from { transform: translateY(14px) }
        to   { transform: translateY(0) }
      }
      .d1 { animation-delay: .10s } .d2 { animation-delay: .28s }
      .d3 { animation-delay: .46s } .d4 { animation-delay: .64s }

      .sweep { animation: sweep 1.2s ease-out both .5s; transform-origin: 0 0; }
      @keyframes sweep { from { transform: scaleX(0) } to { transform: scaleX(1) } }

      .pulse { animation: pulse 4.5s ease-in-out infinite }
      @keyframes pulse { 0%,100% { opacity:.4 } 50% { opacity:.85 } }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>
    <rect width="1200" height="260" fill="url(#glow)"/>

    <!-- terminal chrome -->
    <rect width="1200" height="40" fill="#0B0F14" fill-opacity="0.75"/>
    <line x1="0" y1="40" x2="1200" y2="40" stroke="#1F2A31" stroke-width="1"/>
    <circle cx="26" cy="20" r="6.5" fill="#FF5F57"/>
    <circle cx="48" cy="20" r="6.5" fill="#FEBC2E"/>
    <circle cx="70" cy="20" r="6.5" fill="#28C840"/>
    <text class="mono chrome" x="98" y="25">prin@cipher.academy — ~/bugbounty</text>
    <text class="mono chrome" x="1176" y="25" text-anchor="end">zsh</text>

    <!-- prompt -->
    <g class="rise d1">
      <text class="mono" x="44" y="96" font-size="17">
        <tspan class="accent">$</tspan><tspan class="dim" dx="10">whoami</tspan>
      </text>
    </g>

    <!-- name -->
    <g class="rise d2">
      <text class="mono name" x="44" y="162">PRIN<tspan class="accent"> SHARMA</tspan></text>
    </g>

    <!-- role line; cursor is a tspan so it always lands after the text -->
    <g class="rise d3">
      <text class="mono role" x="44" y="200">Bug Bounty Hunter<tspan class="dim"> · </tspan>Reverse Engineer<tspan class="dim"> · </tspan>Full-Stack Builder<tspan class="cursor" dx="8">█</tspan></text>
    </g>

    <!-- sweeping accent rule -->
    <rect class="sweep" x="0" y="216" width="1200" height="1.6" fill="url(#rule)"/>

    <!-- footer meta -->
    <g class="rise d4">
      <text class="mono meta" x="44" y="240">INDIA<tspan fill="#2F3A42">   ·   </tspan>CIPHER.ACADEMY</text>
      <text class="mono meta" x="1176" y="240" text-anchor="end">BREAK IT · REPORT IT · FIX IT</text>
    </g>

    <!-- corner bracket (top-right only; a bottom-left one collided with the role line) -->
    <g stroke="#00FF9C" stroke-width="1.6" fill="none" class="pulse" stroke-linecap="square">
      <path d="M1168 60 h18 v18"/>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="259" rx="14" fill="none" stroke="#243239" stroke-width="1"/>
  </g>
</svg>
